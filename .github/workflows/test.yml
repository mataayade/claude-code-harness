name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (syntax and undefined names)
        run: ruff check --select E9,F .

      - name: Run hook tests
        run: pytest -q

      - name: Sanitize gate (no private data may enter the repo)
        run: python sanitize.py
